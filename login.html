<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm RAG 登入</title>
  <meta name="description" content="Alarm RAG 角色式維修工作台登入">
  <link rel="stylesheet" href="/static/css/tokens.css?v=1">
  <link rel="stylesheet" href="/static/css/login.css?v=password-type-1">
  <link rel="stylesheet" href="/static/css/accessibility.css?v=1">
</head>
<body data-page="login">
  <a class="skip-link" href="#main-content">跳至主要內容</a>
  <div class="lg-bg">
    <div class="lg-grid"></div>
    <div class="lg-glow lg-glow--1"></div>
    <div class="lg-glow lg-glow--2"></div>
    <div class="lg-glow lg-glow--3"></div>
  </div>

  <main class="login-shell" id="main-content" tabindex="-1">
    <section class="login-panel" id="loginPanel">
      <div class="lg-brand">
        <div class="lg-brand-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <div>
          <h1 class="lg-title">ALARM RAG</h1>
          <p class="lg-subtitle">設備查詢與維修流程</p>
        </div>
      </div>

      <div class="lg-divider"><span>登入</span></div>

      <form class="lg-form" id="loginForm">
        <div class="lg-field">
          <label class="lg-label" for="loginUsername">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            使用者 ID
          </label>
          <input class="lg-input" id="loginUsername" autocomplete="username" placeholder="輸入使用者 ID">
        </div>
        <div class="lg-field">
          <label class="lg-label" for="loginPassword">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            密碼
          </label>
          <input class="lg-input" id="loginPassword" type="password" autocomplete="current-password" placeholder="輸入密碼">
        </div>
        <button class="lg-submit" id="loginSubmit" type="submit">
          <span>登入</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
        <div class="upload-result" id="loginResult"></div>
      </form>

      <form class="lg-form" id="initialPasswordForm" hidden>
        <p class="lg-description">首次登入或使用臨時密碼時，請先設定自己的個人密碼，完成後以新密碼登入。</p>
        <div class="lg-field">
          <label class="lg-label" for="initialNewPassword">新密碼（至少 8 個字元）</label>
          <input class="lg-input" id="initialNewPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="lg-field">
          <label class="lg-label" for="initialConfirmPassword">再次輸入新密碼</label>
          <input class="lg-input" id="initialConfirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button class="lg-submit" id="initialPasswordSubmit" type="submit">設定新密碼</button>
        <button class="lg-submit" id="initialPasswordCancel" type="button">返回登入</button>
        <div class="upload-result" id="initialPasswordResult" role="status" aria-live="polite"></div>
      </form>

      <div class="lg-hint">
        <span id="loginConfigHint">請輸入管理員提供的帳號及密碼；首次登入會引導設定個人密碼。</span>
      </div>
      <details class="lg-hint">
        <summary>忘記密碼？</summary>
        <p>請聯絡公司管理員確認身分並取得臨時密碼。登入後由你設定個人密碼；若仍記得目前密碼，可登入後按頁首「更改密碼」。</p>
      </details>
    </section>
  </main>

  <script src="/static/js/core/api.js?v=auth-5"></script>
  <script src="/static/js/pages/login.js?v=password-zh-1"></script>
</body>
</html>
